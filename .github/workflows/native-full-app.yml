name: Native Full App workspace

on:
  pull_request:
    paths:
      - "src/routes/full-app.tsx"
      - "src/routes/api/full-app/**"
      - "src/lib/full-app-edits.ts"
      - "src/lib/full-app-build.ts"
      - "src/lib/full-app-scaffold.ts"
      - "src/lib/full-app-backend.ts"
      - "src/lib/full-app-design.ts"
      - "src/lib/full-app-blueprint.ts"
      - "src/lib/full-app-integrations.ts"
      - "src/routes/api/full-app/plan.ts"
      - "src/lib/__tests__/full-app-design.selftest.mts"
      - "src/lib/__tests__/full-app-blueprint.selftest.mts"
      - "src/lib/__tests__/full-app-backend.selftest.mts"
      - "src/lib/__tests__/full-app-managed-build.selftest.mts"
      - "src/lib/react-preview.ts"
      - "src/components/LiveReactPreview.tsx"
      - "src/lib/__tests__/react-preview.selftest.mts"
      - "src/lib/__tests__/native-full-app.selftest.mts"
      - "src/routes/api/github.ts"
      - "src/components/GithubModal.tsx"
      - "src/components/ObsidianModeNav.tsx"
      - ".github/workflows/native-full-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked packages
        run: bun install --frozen-lockfile
      - name: Test native workspace edit protocol
        run: bun src/lib/__tests__/native-full-app.selftest.mts
      - name: Test isolated React preview compiler
        run: bun src/lib/__tests__/react-preview.selftest.mts
      - name: Test managed build and deploy scaffolding
        run: bun src/lib/__tests__/full-app-managed-build.selftest.mts
      - name: Test generated backend, storage RLS and migration protection
        run: bun src/lib/__tests__/full-app-backend.selftest.mts
      - name: Test design reference sanitization before AI conversion
        run: bun src/lib/__tests__/full-app-design.selftest.mts
      - name: Test native application blueprint architecture
        run: bun src/lib/__tests__/full-app-blueprint.selftest.mts
      - name: Build app and generate TanStack route registry
        run: bun run build
      - name: TypeScript validation
        run: bunx tsc --noEmit
