name: Pocket runtime guardrails

on:
  push:
    branches:
      - claude/pocket-bolt-restyle
      - main
    paths:
      - "src/routes/pocket.tsx"
      - "src/routes/api/generate.ts"
      - "src/routes/api/jobs.create.ts"
      - "src/routes/api/jobs.$id.ts"
      - "src/lib/build-jobs.server.ts"
      - "src/lib/run-build-job.server.ts"
      - "src/routes/api/project-assets.ts"
      - "src/lib/refine-preservation.ts"
      - "src/lib/pocket-project-assets.ts"
      - "src/components/PocketProjectAssetsPanel.tsx"
      - "src/components/GithubModal.tsx"
      - "scripts/verify-pocket-runtime.mjs"
      - "src/lib/__tests__/pocket-runtime.selftest.mts"
      - "src/lib/__tests__/refine-preservation.selftest.mts"
      - ".github/workflows/pocket-runtime.yml"
  pull_request:
    paths:
      - "src/routes/pocket.tsx"
      - "src/routes/api/generate.ts"
      - "src/routes/api/jobs.create.ts"
      - "src/routes/api/jobs.$id.ts"
      - "src/lib/build-jobs.server.ts"
      - "src/lib/run-build-job.server.ts"
      - "src/routes/api/project-assets.ts"
      - "src/lib/refine-preservation.ts"
      - "src/lib/pocket-project-assets.ts"
      - "src/components/PocketProjectAssetsPanel.tsx"
      - "src/components/GithubModal.tsx"
      - "scripts/verify-pocket-runtime.mjs"
      - "src/lib/__tests__/pocket-runtime.selftest.mts"
      - "src/lib/__tests__/refine-preservation.selftest.mts"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify source contracts
        run: node scripts/verify-pocket-runtime.mjs
      - name: Test pure Pocket guardrails
        run: bun src/lib/__tests__/pocket-runtime.selftest.mts
      - name: Test Refine design preservation
        run: bun src/lib/__tests__/refine-preservation.selftest.mts
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
