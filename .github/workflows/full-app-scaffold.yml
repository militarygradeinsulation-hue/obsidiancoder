name: Full App scaffold verification

on:
  pull_request:
    paths:
      - "src/lib/full-app-scaffold.ts"
      - "src/lib/full-app-backend.ts"
      - "src/lib/__tests__/full-app-scaffold.selftest.mts"
      - ".github/workflows/full-app-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate starter and verify production build
        run: node --experimental-strip-types src/lib/__tests__/full-app-scaffold.selftest.mts
        env:
          VERIFY_FULL_APP_BUILD: "1"
